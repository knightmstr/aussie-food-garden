name: Fetch photos (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidates or final
        default: candidates
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-photos.mjs ${{ github.event.inputs.mode }}
      - uses: actions/upload-artifact@v4
        with:
          name: photos-${{ github.event.inputs.mode }}
          path: out
