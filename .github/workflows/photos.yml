name: Fetch photos (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidates or final
        default: candidates
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-photos.mjs ${{ github.event.inputs.mode }}
      - name: Publish results to a scratch branch
        run: |
          mkdir /tmp/res && cp -r out/* /tmp/res/
          git config user.name "photo-bot"; git config user.email "photo-bot@users.noreply.github.com"
          git checkout --orphan photos-${{ github.event.inputs.mode }}
          git rm -rf -q . 
          cp -r /tmp/res/* .
          git add -A && git commit -q -m "photos ${{ github.event.inputs.mode }}"
          git push -f origin photos-${{ github.event.inputs.mode }}
